<mat-card class="project-card">
  <mat-card-header>
    <mat-card-title>Portfolio Website</mat-card-title>
    <mat-card-subtitle>Personal Branding & Portfolio</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>A modern, Material Design 3 portfolio featuring custom glassmorphism and theme-aware architecture.</p>

    <mat-chip-set aria-label="Tech Stack">
      <mat-chip>Angular 21</mat-chip>
      <mat-chip>SCSS</mat-chip>
      <mat-chip>TypeScript</mat-chip>
    </mat-chip-set>
  </mat-card-content>

  <mat-card-actions align="end" class="project-actions">
    <a mat-button href="https://github.com/porter-peterson/portfolio" target="_blank">
      <fa-icon [icon]="faGithub"></fa-icon> GitHub Repository
    </a>
  </mat-card-actions>
</mat-card>
