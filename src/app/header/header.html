<div>
  <h1>Porter Peterson</h1>
  <div class="header-actions">
    <a mat-icon-button href="https://linkedin.com/in/porter-peterson" target="_blank" aria-label="LinkedIn">
      <fa-icon [icon]="faLinkedin"></fa-icon>
    </a>
    <a mat-icon-button href="https://github.com/porter-peterson" target="_blank" aria-label="GitHub">
      <fa-icon [icon]="faGithub"></fa-icon>
    </a>
    <button mat-icon-button (click)="themeService.toggleTheme()">
      <mat-icon>{{ themeService.isDarkTheme() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </div>
</div>
